<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08080a">
<meta name="robots" content="noindex, nofollow">
<title>MUAY THAI INTELLIGENCE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="brand/icon-192.png">
<link rel="apple-touch-icon" href="brand/icon-192.png">
<link rel="preload" href="fonts/kanit-thai-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/kanit-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-sans-thai-thai-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <!-- ===================== ATTRACT ===================== -->
  <section id="attract" class="screen active">
    <video class="bg-video" id="attractBg" autoplay muted loop playsinline preload="auto"></video>
    <div class="bg-shade"></div>
    <div class="a-top"><span class="live-dot"></span>MUAY THAI INTELLIGENCE · AI EXPO THAILAND</div>
    <div class="a-mid">
      <h1 class="a-logo"><img src="brand/mti_lockup_white.png" alt="MUAY THAI INTELLIGENCE"></h1>
      <div class="a-sub"><span data-l="th">ข้อมูลการเคลื่อนไหวของนักมวยไทย จากอดีตถึงปัจจุบัน</span><span data-l="en">Muay Thai movement data, from past to present</span></div>
      <div class="a-band">
        <video id="attractReel" autoplay muted loop playsinline preload="auto"></video>
        <i class="bc tl"></i><i class="bc tr"></i><i class="bc bl"></i><i class="bc br"></i>
      </div>
      <div class="a-axis" id="attractAxis"></div>
    </div>
    <div class="a-bottom">
      <div class="tap"><span class="ring"></span><span class="ring r2"></span><span class="dot"></span></div>
      <div class="start-row">
        <button class="start" data-start="th"><b>แตะเพื่อเริ่ม</b><span>ภาษาไทย</span></button>
        <button class="start" data-start="en"><b>Tap to start</b><span>ENGLISH</span></button>
      </div>
      <div class="ticker" id="attractTicker"></div>
      <div class="powered"><span>POWERED BY</span><img src="brand/partners/originals.png" alt="ORIGINALS STUDIO" class="mono"></div>
    </div>
  </section>

  <!-- ===================== HOME ===================== -->
  <section id="home" class="screen">
    <div class="grain"></div>
    <header class="topbar">
      <img class="top-logo" src="brand/mti_lockup_white.png" alt="MUAY THAI INTELLIGENCE">
      <button class="lang" data-lang-toggle><span data-v="th">ไทย</span><span data-v="en">EN</span></button>
    </header>
    <div class="h-intro">
      <div class="kicker" data-t="homeKicker"></div>
      <h2><span data-t="homeH1"></span><br><em data-t="homeH2"></em></h2>
    </div>
    <div class="sec"><b>01–03</b><span data-t="secCapture"></span></div>
    <div class="tracks" id="trackCards"></div>
    <div class="sec"><b>04</b><span data-t="secUse"></span></div>
    <div class="uses" id="useTiles"></div>
    <footer class="h-foot"><span>POWERED BY</span><img src="brand/partners/originals.png" alt="ORIGINALS STUDIO" class="mono"></footer>
  </section>

  <!-- ===================== TRACK ===================== -->
  <section id="track" class="screen">
    <div class="grain"></div>
    <header class="topbar">
      <button class="back" data-go="home"><span>←</span><i data-t="back"></i></button>
      <button class="lang" data-lang-toggle><span data-v="th">ไทย</span><span data-v="en">EN</span></button>
    </header>
    <div class="t-head">
      <div class="t-no" id="tNo"></div>
      <h2 id="tTitle"></h2>
      <div class="t-sub" id="tSub"></div>
    </div>
    <div class="t-stage">
      <video id="trackVideo" muted playsinline loop preload="auto"></video>
      <div class="t-stepbadge" id="tBadge"></div>
      <div class="t-prog"><div id="tProg"></div></div>
    </div>
    <div class="t-step">
      <div class="t-step-k" id="sK"></div>
      <h3 id="sH"></h3>
      <p id="sD"></p>
      <div class="t-get" id="sG"></div>
      <div class="t-note" id="sN"></div>
    </div>
    <div class="t-nav">
      <button class="navbtn" id="stepPrev" aria-label="prev">‹</button>
      <div class="dots" id="stepDots"></div>
      <button class="navbtn next" id="stepNext" aria-label="next">›</button>
    </div>
    <div class="t-list" id="stepList"></div>
  </section>

  <!-- ===================== PLAYER ===================== -->
  <section id="player" class="screen">
    <div class="grain"></div>
    <header class="topbar">
      <button class="back" id="playerBack"><span>←</span><i data-t="back"></i></button>
      <img class="top-logo sm" src="brand/mti_lockup_white.png" alt="">
    </header>
    <div class="p-stage">
      <video id="mainVideo" playsinline preload="auto"></video>
      <button class="p-big" id="bigPlay" aria-label="play"></button>
    </div>
    <div class="p-bar">
      <div class="p-progress" id="progress"><div class="p-fill" id="progressFill"></div><div class="p-knob" id="progressKnob"></div></div>
      <div class="p-times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="p-controls">
      <button class="ctl" id="btnRestart" aria-label="restart">↺</button>
      <button class="ctl main" id="btnPlay" aria-label="play/pause"></button>
      <button class="ctl" id="btnSound" aria-label="sound">🔊</button>
    </div>
    <div class="p-info">
      <div class="p-no" id="pNo"></div>
      <h2 id="pTitle"></h2>
      <div class="p-th" id="pTh"></div>
    </div>
  </section>

  <!-- ===================== PARTNERS ===================== -->
  <section id="partners" class="screen">
    <div class="grain"></div>
    <header class="topbar">
      <button class="back" data-go="home"><span>←</span><i data-t="back"></i></button>
      <button class="lang" data-lang-toggle><span data-v="th">ไทย</span><span data-v="en">EN</span></button>
    </header>
    <div class="s-head">
      <div class="kicker">TOGETHER WITH</div>
      <h2 data-t="partners"></h2>
      <p class="s-lead" data-t="partnersSub"></p>
    </div>
    <div id="partnerGroups"></div>
    <div class="pw-big"><span>POWERED BY</span><img src="brand/partners/originals.png" alt="ORIGINALS STUDIO"></div>
  </section>

  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-back" data-close></div>
    <div class="sheet-card">
      <button class="sheet-x" data-close>✕</button>
      <div class="sheet-logo"><img id="shLogo" alt=""></div>
      <div class="sheet-line" id="shLine"></div>
      <div id="shBody"></div>
    </div>
  </div>

  <div class="askbar" id="askbar"><i></i><span data-t="ask"></span></div>
  <div id="admin-hotspot"></div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
